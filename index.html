<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Relevamiento de Equipos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 Relevamiento de Equipos</h1>
            <p>Registra los equipos con sus certificados</p>
        </header>

        <main>
            <!-- Formulario de ingreso -->
            <section class="form-section">
                <h2>Ingresar Nuevo Equipo</h2>
                <form id="equipoForm">
                    <div class="form-group">
                        <label for="numeroSerie">Número de Serie:</label>
                        <input type="text" id="numeroSerie" placeholder="Ej: SN123456789" required>
                    </div>

                    <div class="form-group">
                        <label for="claseEquipo">Clase de Equipo:</label>
                        <input type="text" id="claseEquipo" placeholder="Ej: Monitor, CPU, Teclado, etc." required>
                    </div>

                    <div class="form-group">
                        <label for="certificado">¿Tiene Certificado?</label>
                        <select id="certificado" required>
                            <option value="">-- Selecciona --</option>
                            <option value="Sí">Sí</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="piso">Número de Piso:</label>
                        <select id="piso" required>
                            <option value="">-- Selecciona --</option>
                            <option value="Piso 1">Piso 1</option>
                            <option value="Piso 2">Piso 2</option>
                            <option value="Piso 3">Piso 3</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-agregar">✏️ Agregar Equipo</button>
                </form>
            </section>

            <!-- Tabla de equipos -->
            <section class="tabla-section">
                <div class="tabla-header">
                    <h2>Equipos Relevados</h2>
                    <button id="exportarBtn" class="btn-exportar">📊 Exportar a Excel</button>
                </div>
                
                <div id="tablaContainer">
                    <p class="sin-datos">No hay equipos cargados aún</p>
                </div>
                <p id="totalEquipos" style="margin-top: 15px; text-align: right; color: #7f8c8d; font-weight: 600;"></p>
            </section>
        </main>

        <footer>
            <p>© 2024 Sistema de Relevamiento de Equipos</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
